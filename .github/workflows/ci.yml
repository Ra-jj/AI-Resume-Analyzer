name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --max-warnings=0 so a warning fails the job instead of passing silently.
      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
